<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انتقال به سایت جدید | Yashar Club</title>
    <!-- Tailwind CSS for modern responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.15) 0px, transparent 50%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .glow-effect {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <main class="w-full max-w-lg glass-card rounded-3xl p-8 md:p-10 shadow-2xl text-center relative overflow-hidden">
        
        <!-- Decorative Background Glow -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Badge -->
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs font-medium mb-6">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            انتقال سراسری دامنه
        </div>

        <!-- Icon / Graphic -->
        <div class="w-20 h-20 mx-auto mb-6 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/25 glow-effect">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <!-- Headings -->
        <h1 class="text-2xl md:text-3xl font-black text-white mb-3">
            این لینک دیگر فعال نیست!
        </h1>
        <p class="text-slate-300 text-sm md:text-base leading-relaxed mb-8">
            سامانه <span class="text-cyan-400 font-medium">یاشار کلاب</span> برای ارائه خدمات بهتر و سریع‌تر به آدرس جدید منتقل شده است.
        </p>

        <!-- New Link Box -->
        <div class="bg-slate-900/60 border border-slate-700/50 rounded-2xl p-4 mb-8 flex items-center justify-between text-left dir-ltr">
            <span class="text-xs md:text-sm text-cyan-300 font-mono truncate px-2">https://yashar-club.vercel.app</span>
            <button onclick="copyLink(this)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition-all border border-slate-600 shrink-0">
                کپی لینک
            </button>
        </div>

        <!-- Action Button -->
        <div class="space-y-4">
            <a href="https://yashar-club.vercel.app" class="w-full flex items-center justify-center gap-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-cyan-500/25 transition-all duration-300 transform hover:-translate-y-0.5">
                <span>ورود به سایت جدید</span>
                <svg class="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </a>

            <!-- Timer info -->
            <div id="timer-box" class="text-xs text-slate-400 flex items-center justify-center gap-1.5">
                <span>انتقال خودکار تا</span>
                <span id="countdown" class="font-bold text-amber-400 text-sm">6</span>
                <span>ثانیه دیگر...</span>
                <button onclick="cancelRedirect()" class="underline text-slate-500 hover:text-slate-300 mr-2">لغو</button>
            </div>
        </div>

        <!-- Footer branding -->
        <div class="mt-8 pt-6 border-t border-slate-800/80 text-xs text-slate-500">
            Yashar Club &copy; All Rights Reserved
        </div>

    </main>

    <script>
        let timeLeft = 6;
        let isRedirectCancelled = false;
        const countdownEl = document.getElementById('countdown');
        const timerBox = document.getElementById('timer-box');

        const countdownInterval = setInterval(() => {
            if (isRedirectCancelled) return;
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                window.location.href = "https://yashar-club.vercel.app";
            }
        }, 1000);

        function cancelRedirect() {
            isRedirectCancelled = true;
            clearInterval(countdownInterval);
            timerBox.innerHTML = '<span class="text-slate-400">انتقال خودکار لغو شد. لطفاً روی دکمه بالا کلیک کنید.</span>';
        }

        function copyLink(btn) {
            const url = "https://yashar-club.vercel.app";
            const textArea = document.createElement("textarea");
            textArea.value = url;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const originalText = btn.textContent;
                btn.textContent = 'کپی شد!';
                btn.classList.add('bg-emerald-600', 'text-white');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('bg-emerald-600', 'text-white');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
